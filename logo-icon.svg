<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="BrightSmile Dental appointment logo">
  <defs>
    <linearGradient id="clinicGradient" x1="12" y1="8" x2="88" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="toothShade" x1="35" y1="23" x2="64" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff8ff"/>
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="94" height="94" rx="27" fill="url(#clinicGradient)"/>
  <path d="M17 28C17 17 26 10 37 10h26c11 0 20 7 20 18v1H17z" fill="#ffffff" fill-opacity=".12"/>

  <!-- Tooth silhouette with a smile-shaped highlight -->
  <path d="M50 24c-5.8-5.3-16.2-4.1-20.2 2.8-4.1 7.1-.4 19.2 2.7 28.5 2.5 7.6 5.2 15.1 9.3 15.1 3.6 0 3.8-10.1 8.2-10.1s4.6 10.1 8.2 10.1c4.1 0 6.8-7.5 9.3-15.1 3.1-9.3 6.8-21.4 2.7-28.5C66.2 19.9 55.8 18.7 50 24z" fill="url(#toothShade)"/>
  <path d="M39 34c3.1-2.7 7-3.2 11-1.6" fill="none" stroke="#58c8cf" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Appointment badge and check mark -->
  <circle cx="72" cy="70" r="17" fill="#083344" stroke="#9ff3df" stroke-width="3"/>
  <path d="M64.5 69.8l5 5 10-11" fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small sparkle for a fresh, healthy smile -->
  <path d="M25 47l1.8 4.2L31 53l-4.2 1.8L25 59l-1.8-4.2L19 53l4.2-1.8L25 47z" fill="#c9fff1"/>
</svg>
