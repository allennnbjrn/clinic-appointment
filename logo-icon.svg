<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="BrightSmile Luxury Dental Clinic logo">
  <defs>
    <linearGradient id="luxuryBg" x1="10" y1="8" x2="90" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b2239"/>
      <stop offset="0.42" stop-color="#0f3a5e"/>
      <stop offset="1" stop-color="#0a6b8d"/>
    </linearGradient>
