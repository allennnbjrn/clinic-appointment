<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="BrightSmile Dental clinic logo">
  <defs>
    <linearGradient id="brand" x1="12" y1="8" x2="88" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27d3c2"/>
      <stop offset=".52" stop-color="#0ba6c8"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="enamel" x1="34" y1="20" x2="64" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff8ff"/>
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="94" height="94" rx="27" fill="url(#brand)"/>
  <path d="M16 31C20 16 34 9 50 9s30 7 34 22c-10-7-21-9-34-9s-24 2-34 9Z" fill="#fff" opacity=".1"/>

  <!-- Original tooth mark: an open, flowing outline shaped like a smile -->
  <path d="M48 22c-8-4-18-1-21 7-3 7 0 17 4 27l8 17c2 4 6 6 9 2l5-8c1-2 3-2 4 0l5 8c3 4 7 2 9-2l8-17c4-10 7-20 4-27-3-8-13-11-21-7-4 2-8 2-13 0Z" fill="url(#enamel)"/>

  <!-- Signature curved smile / sparkle detail -->
  <path d="M37 43c4 5 9 7 13 7s9-2 13-7" fill="none" stroke="#22b9c3" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M50 30v11" fill="none" stroke="#c5eaf2" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Distinctive appointment seal integrated with the tooth -->
  <circle cx="72" cy="70" r="16" fill="#083344" stroke="#a8f3e5" stroke-width="2.5"/>
  <path d="m65.5 70 4.5 4.5 9.5-10.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Four-point glint gives the mark a recognizable, polished accent -->
  <path d="m24 37 2.2 5.8L32 45l-5.8 2.2L24 53l-2.2-5.8L16 45l5.8-2.2L24 37Z" fill="#d5fff6"/>
</svg>
